<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>保存到本地</title></head><body><header><h1>保存到本地</h1><span class="version">开发版 0.4</span></header><p id="source" class="source">当前文件</p><label class="format-label">新副本格式<select id="format" aria-label="新副本格式"><option value="both">可编辑副本和 HTML</option><option value="localdoc">可编辑副本</option><option value="html">HTML 阅读版（保留恢复副本）</option></select></label><section aria-live="polite" aria-atomic="true"><h2 id="status">正在查看保存任务…</h2><p id="detail">正在连接本地应用…</p><progress id="progress" aria-label="任务正在处理" hidden></progress><small id="diagnostic"></small></section><div class="actions"><button id="retry" hidden>重新读取</button><button id="new-copy" hidden>再次保存新副本</button><button id="cancel" class="secondary" hidden>停止后续读取</button><button id="check" class="secondary" hidden>检查本次结果</button></div><footer>可编辑副本保存在本地应用。内容完整性与回导效果仍需单独核对。</footer><script type="module" src="popup.js"></script></body></html>
